<!doctype html>
<html lang="{{language}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · {{site_title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical_url}}">

<meta property="og:type" content="article">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical_url}}">
<meta property="og:image" content="{{og_image}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{og_image}}">

<script type="application/ld+json">
{{jsonld}}
</script>

<style>
{{style}}
{{pygments_style}}
</style>
</head>
<body>
<main>
  <article>
    <header>
      <h1>{{title}}</h1>
      <time class="article-date" datetime="{{date_iso}}">{{date_display}}</time>
      <div class="article-meta-row">
        <div class="tags">{{tags_html}}</div>
        <button type="button" class="summary-toggle" id="summary-toggle" aria-expanded="false" aria-controls="summary-box">
          Zusammenfassung <span class="summary-toggle-icon" aria-hidden="true">&#9662;</span>
        </button>
      </div>
    </header>
    <div class="summary-box" id="summary-box">
      <div class="summary-box-inner">
        {{summary_html}}
      </div>
    </div>
    {{content}}
  </article>
</main>

<footer class="site-footer">
  <p>{{author}} — <a href="{{base_url}}/rss.xml">RSS</a></p>
</footer>

<div class="lightbox-overlay" id="lightbox-overlay">
  <img id="lightbox-img" src="" alt="">
</div>
<script>
(function () {
  var overlay = document.getElementById('lightbox-overlay');
  var overlayImg = document.getElementById('lightbox-img');

  function openLightbox(src, alt) {
    overlayImg.src = src;
    overlayImg.alt = alt || '';
    overlay.classList.add('is-open');
  }
  function closeLightbox() {
    overlay.classList.remove('is-open');
    overlayImg.src = '';
  }

  document.querySelectorAll('article img').forEach(function (el) {
    el.addEventListener('click', function () {
      openLightbox(el.getAttribute('src'), el.getAttribute('alt'));
    });
  });

  overlay.addEventListener('click', closeLightbox);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeLightbox();
  });

  var summaryBtn = document.getElementById('summary-toggle');
  var summaryBox = document.getElementById('summary-box');
  if (summaryBtn && summaryBox) {
    summaryBtn.addEventListener('click', function () {
      var isOpen = summaryBox.classList.toggle('is-open');
      summaryBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });
  }
})();
</script>
</body>
</html>
