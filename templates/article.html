<!doctype html>
<html lang="{{language}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · {{site_title}}</title>
<link rel="canonical" href="{{canonical_url}}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.48.0/tabler-icons.min.css">

<meta name="author" content="{{author}}">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<link rel="alternate" type="application/rss+xml" title="{{site_title}}" href="{{base_url}}/rss.xml">

<meta property="og:type" content="article">
<meta property="og:site_name" content="{{site_title}}">
<meta property="og:locale" content="{{og_locale}}">
<meta name="title" property="og:title" content="{{title}}">
<meta name="description" property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical_url}}">
{{og_image_tags}}
<meta name="twitter:card" content="{{twitter_card}}">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
{{twitter_image_tag}}
{{article_meta}}

<script type="application/ld+json">
{{jsonld}}
</script>

<style>
{{style}}
{{pygments_style}}
</style>
</head>
<body>
<main>
  <article>
    <header>
      <h1>{{title}}</h1>
      <time class="article-date" datetime="{{date_iso}}">{{date_display}}</time>
      <div class="article-meta-row">
        <div class="tags">{{tags_html}}</div>
        <button type="button" class="summary-toggle" id="summary-toggle" aria-expanded="true" aria-controls="summary-box">
          Zusammenfassung <span class="summary-toggle-icon" aria-hidden="true">&#9662;</span>
        </button>
      </div>
    </header>
    <div class="summary-box is-open" id="summary-box">
      <div class="summary-box-inner">
        {{summary_html}}
      </div>
    </div>
    {{eyecatcher_html}}
    {{content}}
    {{changelog_html}}
  </article>
</main>

<footer class="site-footer">
  <p>{{author}} — <a href="{{base_url}}/rss.xml">RSS</a></p>
</footer>

<div class="lightbox-overlay" id="lightbox-overlay">
  <img id="lightbox-img" src="" alt="">
</div>
<script>
(function () {
  var overlay = document.getElementById('lightbox-overlay');
  var overlayImg = document.getElementById('lightbox-img');

  function openLightbox(src, alt) {
    overlayImg.src = src;
    overlayImg.alt = alt || '';
    overlay.classList.add('is-open');
  }
  function closeLightbox() {
    overlay.classList.remove('is-open');
    overlayImg.src = '';
  }

  document.querySelectorAll('article img').forEach(function (el) {
    el.addEventListener('click', function () {
      openLightbox(el.getAttribute('src'), el.getAttribute('alt'));
    });
  });

  overlay.addEventListener('click', closeLightbox);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeLightbox();
  });

  var summaryBtn = document.getElementById('summary-toggle');
  var summaryBox = document.getElementById('summary-box');
  if (summaryBtn && summaryBox) {
    summaryBtn.addEventListener('click', function () {
      var isOpen = summaryBox.classList.toggle('is-open');
      summaryBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });
  }
})();
</script>
</body>
</html>
