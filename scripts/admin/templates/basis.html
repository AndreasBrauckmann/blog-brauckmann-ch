<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block titel %}Verwaltung{% endblock %} · Blog-Verwaltung</title>
<style>
:root { --bg:#f3f5fb; --fg:#1d2433; --muted:#5d6779; --border:#e4e8f2; --ok:#1f8a55; --bad:#c0392b; --warn:#9a6700; --card:#ffffff; --accent:#4260c9; --bar:#e4e8f2; --code:#eef1f9;
  --akzent-weich:#e6ecfd; --ok-weich:#e3f5ec; --manuell-weich:#eef0f5; --pastell:#eef2ff; --pastell-ok:#eaf6f1; --pastell-man:#fdf1e6;
  --schatten-1:0 1px 2px rgba(31,41,80,.06), 0 2px 6px rgba(31,41,80,.05);
  --schatten-2:0 2px 4px rgba(31,41,80,.05), 0 8px 24px rgba(31,41,80,.09);
  --innen:inset 0 1px 2px rgba(31,41,80,.07); }
@media (prefers-color-scheme: dark) {
  :root { --bg:#13151c; --fg:#e8eaf2; --muted:#9aa3b8; --border:#2b3040; --ok:#5fd19a; --bad:#ff6b6b; --warn:#f0b429; --card:#1c1f2a; --accent:#8fa6f5; --bar:#2b3040; --code:#232736;
    --akzent-weich:#262d4a; --ok-weich:#1f3a30; --manuell-weich:#262a37; --pastell:#22284a; --pastell-ok:#1f3a30; --pastell-man:#3a2e22;
    --schatten-1:0 1px 2px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.25);
    --schatten-2:0 2px 4px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.45);
    --innen:inset 0 1px 3px rgba(0,0,0,.45); }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background:var(--bg); color:var(--fg); font-family:-apple-system,Segoe UI,Roboto,sans-serif; max-width:1280px; margin:0 auto; padding:1rem 1rem 3rem; line-height:1.5; }
h1 { font-size:1.4rem; margin:.4rem 0 .8rem; }
h2 { font-size:1.15rem; margin:1.8rem 0 .6rem; }
h3 { font-size:1rem; margin:1.2rem 0 .4rem; }
a { color:var(--accent); }
.kopf { background:var(--card); border-radius:16px; box-shadow:var(--schatten-2); overflow:hidden; margin-bottom:1.3rem; }
.ebene1 { display:flex; align-items:center; gap:.4rem; padding:.7rem 1.1rem; flex-wrap:wrap; }
.marke { font-weight:700; font-size:1.05rem; margin-right:.8rem; }
.tab { padding:.4rem .95rem; border-radius:10px; color:var(--muted); text-decoration:none; font-weight:500; font-size:.92rem; }
.tab:hover { background:var(--manuell-weich); color:var(--fg); }
.tab[aria-current=page] { background:var(--akzent-weich); color:var(--accent); font-weight:600; box-shadow:var(--schatten-1); }
.ebene2 { display:flex; align-items:center; gap:.5rem; padding:.65rem 1.1rem; background:linear-gradient(180deg,var(--pastell),transparent); border-top:1px solid var(--border); overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:thin; }
.gruppe { font-size:.68rem; font-weight:700; letter-spacing:.08em; color:var(--muted); margin-right:.3rem; flex:0 0 auto; }
.chip { flex:0 0 auto; display:inline-flex; align-items:center; gap:.45rem; padding:.28rem .8rem; border-radius:999px; background:var(--card); border:1px solid var(--border); box-shadow:var(--schatten-1); color:var(--fg); text-decoration:none; font-size:.86rem; white-space:nowrap; transition:box-shadow .15s, transform .15s; }
.chip:hover { box-shadow:var(--schatten-2); transform:translateY(-1px); }
.chip[aria-current=page] { background:var(--akzent-weich); color:var(--accent); font-weight:600; border-color:transparent; }
.kpunkt { width:8px; height:8px; border-radius:50%; background:#98a2b3; flex:0 0 auto; }
.kpunkt.ok { background:var(--ok); box-shadow:0 0 0 3px var(--ok-weich); }
.kpunkt.fehlt { background:var(--bad); }
.artikelwahl { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; margin:.2rem 0 .8rem; }
.artikelwahl select { max-width:100%; min-width:0; flex:1 1 18rem; }
.ampel-gruen { color:var(--ok); } .ampel-gelb { color:var(--warn); } .ampel-rot { color:var(--bad); }
.etikett { display:inline-block; font-size:.72rem; padding:0 .4rem; border-radius:4px; border:1px solid var(--border); color:var(--muted); vertical-align:middle; }
.etikett.belegt { border-color:var(--ok); color:var(--ok); } .etikett.praxis { border-color:var(--warn); color:var(--warn); } .etikett.ungeprueft { border-style:dashed; }
pre.log { white-space:pre-wrap; word-break:break-word; background:var(--code); box-shadow:var(--innen); border-radius:10px; padding:.7rem; max-height:24rem; overflow:auto; font-size:.82rem; }
.card { background:var(--card); border:1px solid var(--border); border-top:4px solid var(--pastell); border-radius:16px; box-shadow:var(--schatten-2); padding:1.1rem 1.25rem; margin-bottom:1.1rem; }
.hinweis { color:var(--muted); font-size:.88rem; }
.meldung { border-left:4px solid var(--ok); background:var(--card); padding:.6rem .8rem; border-radius:6px; margin:.6rem 0; }
.meldung.fehler { border-left-color:var(--bad); }
.badge { display:inline-block; padding:.05rem .55rem; border-radius:999px; font-size:.78rem; white-space:nowrap; border:1px solid transparent; }
.badge.ok, .badge.gruen { background:var(--ok); color:#fff; }
.badge.bad, .badge.rot, .badge.nein { background:var(--bad); color:#fff; }
.badge.gelb, .badge.teils, .badge.veraltet, .badge.eingeschraenkt { background:var(--warn); color:#fff; }
.badge.manual, .badge.offen, .badge.na { background:transparent; color:var(--muted); border-color:var(--border); }
@media (prefers-color-scheme: dark) { .badge.ok, .badge.gruen, .badge.gelb, .badge.teils, .badge.veraltet, .badge.eingeschraenkt, .badge.bad, .badge.rot, .badge.nein { color:#111; } }
.score { font-weight:700; font-variant-numeric:tabular-nums; }
.punkt { display:inline-block; width:.7rem; height:.7rem; border-radius:50%; margin-right:.35rem; vertical-align:baseline; }
.punkt.gruen { background:var(--ok); } .punkt.gelb { background:var(--warn); } .punkt.rot { background:var(--bad); }
.balken { height:.4rem; background:var(--bar); border-radius:999px; overflow:hidden; margin-top:.15rem; min-width:3rem; }
.balken > span { display:block; height:100%; }
.balken > span.gruen { background:var(--ok); } .balken > span.gelb { background:var(--warn); } .balken > span.rot { background:var(--bad); }
button, select, input, textarea { font:inherit; color:var(--fg); }
button, .knopf { padding:.4rem .85rem; border-radius:10px; border:1px solid var(--border); background:var(--card); box-shadow:var(--schatten-1); color:var(--fg); cursor:pointer; text-decoration:none; display:inline-block; font-size:.9rem; line-height:1.3; }
button.primary, .knopf.primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; box-shadow:0 1px 2px rgba(31,41,80,.2),0 4px 12px rgba(66,96,201,.32); }
@media (prefers-color-scheme: dark) { button.primary, .knopf.primary { color:#111; } }
button:disabled { opacity:.5; cursor:not-allowed; }
input[type=text], input[type=url], input[type=date], input[type=number], input[type=file], select, textarea { background:var(--bg); border:1px solid var(--border); border-radius:10px; box-shadow:var(--innen); padding:.4rem .6rem; max-width:100%; }
textarea { width:100%; min-height:3.2rem; }
.row { display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; margin-bottom:.5rem; }
.raster { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:.6rem; }
.raster label { display:flex; flex-direction:column; font-size:.85rem; gap:.15rem; }
code, pre { background:var(--code); border-radius:4px; }
code { padding:0 .25rem; font-size:.88em; overflow-wrap:break-word; }
pre.diff { padding:.7rem; overflow-x:auto; font-size:.85rem; line-height:1.4; white-space:pre-wrap; word-break:break-word; }
pre.diff .plus { color:var(--ok); } pre.diff .minus { color:var(--bad); } pre.diff .info { color:var(--muted); }
table.daten { width:100%; border-collapse:collapse; font-size:.88rem; }
table.daten th, table.daten td { border-bottom:1px solid var(--border); padding:.45rem .45rem; text-align:left; vertical-align:top; }
table.daten th { font-weight:600; font-size:.8rem; color:var(--muted); white-space:nowrap; }
table.daten td.zahl, table.daten th.zahl { text-align:right; font-variant-numeric:tabular-nums; }
.tabwrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
.kopierbar { display:flex; gap:.4rem; align-items:center; flex-wrap:wrap; }
.kopierbar input { flex:1 1 16rem; min-width:0; }
.klein { font-size:.82rem; }
.ok-text { color:var(--ok); } .bad-text { color:var(--bad); } .warn-text { color:var(--warn); }
details > summary { cursor:pointer; }
@media (max-width: 640px) {
  body { padding:.8rem 1rem 2rem; }
  h1 { font-size:1.2rem; }
}
</style>
{% block kopf %}{% endblock %}
</head>
<body>
<header class="kopf">
  <nav class="ebene1" aria-label="Verwaltung">
    <span class="marke">Blog-Verwaltung</span>
    {% for tab in nav_tabs if tab.gruppe == 'arbeit' %}<a class="tab" href="{{ tab.url }}{% if slug is defined and slug and tab.id not in ('deploy','ranking') %}?slug={{ slug }}{% endif %}" {% if seite == tab.id %}aria-current="page"{% endif %}>{{ tab.name }}</a>{% endfor %}
  </nav>
  <nav class="ebene2" aria-label="Kanäle">
    <span class="gruppe">KANÄLE</span>
    {% for tab in nav_tabs if tab.gruppe == 'kanal' %}<a class="chip" href="{{ tab.url }}{% if slug is defined and slug %}?slug={{ slug }}{% endif %}" {% if seite == tab.id %}aria-current="page"{% endif %} title="{{ {'ok':'per API verbunden','fehlt':'Zugang fehlt','manuell':'wird von Hand gepostet'}[tab.status] }}"><i class="kpunkt {{ tab.status }}"></i>{{ tab.name }}</a>{% endfor %}
  </nav>
</header>
{% block inhalt %}{% endblock %}
<script>
// Sendet-Knoepfe gegen Doppelklick sperren und waehrend laengerer LLM-Laeufe beschriften
document.querySelectorAll('form[data-lang]').forEach(function (f) {
  f.addEventListener('submit', function () {
    var b = f.querySelector('button[type=submit]');
    if (b) { b.disabled = true; b.textContent = f.getAttribute('data-lang'); }
  });
});
document.querySelectorAll('[data-kopieren]').forEach(function (b) {
  b.addEventListener('click', function () {
    var el = document.getElementById(b.getAttribute('data-kopieren'));
    var t = el.value || el.textContent;
    var fertig = function () { var a = b.textContent; b.textContent = 'Kopiert'; setTimeout(function () { b.textContent = a; }, 1400); };
    if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(t).then(fertig); }
    else { el.select && el.select(); try { document.execCommand('copy'); fertig(); } catch (e) {} }
  });
});
</script>
{% block skript %}{% endblock %}
</body>
</html>
