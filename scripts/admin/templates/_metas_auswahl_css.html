{# CSS der gemeinsamen Metas-Auswahl (_metas_auswahl.html) #}
<style>
{% include "_pv_css.html" %}
.mk-grid { display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr); gap:2rem; align-items:start; }
.mk-links { min-width:0; }
.mk-rechts { position:sticky; top:.8rem; align-self:start; min-width:0; max-height:calc(100vh - 1.6rem); overflow:auto; }
.mk-gruppe { border:0; border-top:1px solid var(--border); padding:1rem 0 .4rem; margin:0; min-width:0; }
.mk-gruppe:first-child { border-top:0; padding-top:0; }
.mk-gruppe > legend { float:left; width:100%; padding:0; margin:0 0 .35rem; font-weight:600; font-size:.95rem; }
.mk-gruppe > legend + * { clear:both; }
.mk-gruppe .hinweis { font-weight:400; }
.mk-sel { display:flex; gap:.4rem .9rem; align-items:baseline; flex-wrap:wrap; }
.mk-sel-text { flex:1 1 20rem; min-width:0; overflow-wrap:anywhere; }
.mk-sel-meta { display:inline-flex; align-items:center; gap:.3rem; font-size:.8rem; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums; }
.mk-sel-meta .punkt { margin:0; }
.mk-aktionen { display:flex; gap:1.1rem; flex-wrap:wrap; margin:.35rem 0 0; font-size:.82rem; }
.linkknopf { background:none; border:0; padding:0; color:var(--accent); cursor:pointer; font-size:inherit; text-decoration:underline; text-underline-offset:2px; }
.linkknopf[aria-expanded=true]::after { content:" ▴"; } .linkknopf[aria-expanded=false]::after { content:" ▾"; text-decoration:none; }
.mk-alt { margin:.5rem 0 0; padding:.2rem 0 .2rem .8rem; border-left:2px solid var(--border); }
.mk-zeile { display:flex; gap:.6rem; align-items:baseline; padding:.3rem 0; cursor:pointer; font-size:.9rem; min-width:0; }
.mk-zeile input { flex:0 0 auto; margin:0; transform:translateY(.1rem); }
.mk-zt { flex:1 1 auto; min-width:0; overflow-wrap:anywhere; }
.mk-zm { flex:0 0 auto; font-size:.78rem; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums; }
.mk-zm .punkt { margin:0 .25rem 0 0; }
.mk-zm .tag { color:var(--ok); margin-left:.4rem; }
.mk-aus { margin:.3rem 0 0; font-size:.85rem; }
.mk-aus summary { color:var(--muted); cursor:pointer; font-size:.8rem; }
.mk-aus .mk-zeile { color:var(--muted); }
.mk-aus .grund { display:block; font-size:.74rem; }
.mk-editor { margin:.5rem 0 0; }
.mk-editor textarea { width:100%; min-height:3.2rem; resize:vertical; }
.mk-info { display:inline-block; width:1.1rem; height:1.1rem; line-height:1.05rem; text-align:center; border:1px solid var(--border); border-radius:50%; font-size:.72rem; color:var(--muted); cursor:help; }
.mk-streifen { display:flex; gap:.6rem; overflow-x:auto; padding:.2rem .1rem .5rem; -webkit-overflow-scrolling:touch; }
.mk-thumb { flex:0 0 auto; width:116px; cursor:pointer; position:relative; }
.mk-thumb input { position:absolute; opacity:0; pointer-events:none; }
.mk-thumb img { width:116px; aspect-ratio:1.91/1; object-fit:cover; border:2px solid var(--border); border-radius:6px; display:block; background:var(--bar); }
.mk-thumb input:checked + img, .mk-thumb.gewaehlt img { border-color:var(--accent); }
.mk-thumb input:focus-visible + img { outline:2px solid var(--accent); outline-offset:2px; }
.mk-thumb small { display:block; font-size:.7rem; color:var(--muted); margin-top:.15rem; white-space:nowrap; }
.mk-thumb .punkt { margin:0 .2rem 0 0; width:.5rem; height:.5rem; }
.mk-vk { border:1px solid var(--border); border-radius:10px; background:var(--card); overflow:hidden; }
.mk-tabs { display:flex; border-bottom:1px solid var(--border); overflow-x:auto; }
.mk-tabs button { flex:1 0 auto; border:0; border-radius:0; background:none; padding:.55rem .7rem; font-size:.82rem; color:var(--muted); border-bottom:2px solid transparent; white-space:nowrap; }
.mk-tabs button[aria-selected=true] { color:var(--fg); border-bottom-color:var(--accent); font-weight:600; }
.mk-panel { padding:.9rem; }
.mk-panel .pv-post { border:0; padding:0; background:none; max-width:100%; }
.mk-panel .pv-post.schmal { max-width:340px; margin:0 auto; }
.mk-panel .pv-karte:first-child { margin-top:0; }
.gt { max-width:600px; }
.gt-url { font-size:.78rem; color:var(--muted); overflow-wrap:anywhere; }
.gt-titel { color:var(--accent); font-size:1.05rem; line-height:1.3; margin:.1rem 0; overflow-wrap:anywhere; }
.gt-beschr { font-size:.85rem; color:var(--fg); overflow-wrap:anywhere; }
.mk-zaehler { width:100%; border-collapse:collapse; font-size:.82rem; margin-top:.7rem; }
.mk-zaehler td { padding:.25rem .2rem; vertical-align:baseline; }
.mk-zaehler td:first-child { color:var(--muted); }
.mk-zaehler .punkt { margin:0 .3rem 0 0; }
.mk-aktion { margin-top:1rem; }
@media (max-width: 900px) {
  .mk-grid { grid-template-columns:minmax(0,1fr); gap:1.2rem; }
  .mk-rechts { position:static; order:-1; max-height:none; overflow:visible; }
  .mk-aktion { position:sticky; bottom:0; z-index:5; background:var(--bg); padding:.7rem 0; border-top:1px solid var(--border); margin-top:1rem; }
}
</style>
